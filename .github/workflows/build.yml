name: Build WHY2 Desktop

on:
  push:
    branches: [ development, stable, release ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (x86_64)
          - os: macos-latest
            name: macOS (aarch64)
          - os: windows-latest
            name: Windows (x86_64)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # THE WEBVIEW IS webkit2gtk HERE; EVERYTHING AFTER librsvg IS why2-chat'S OWN - THE CALL WANTS ALSA,
      # OPUS AND PIPEWIRE, AND THE SCREEN SHARE WANTS EGL, GBM AND AN ASSEMBLER FOR openh264
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf file \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            pkg-config libasound2-dev libopus-dev libpipewire-0.3-dev libegl-dev \
            clang libclang-dev libgbm-dev nasm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install opus pkg-config nasm

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # THIS RUNS beforeBuildCommand (tsc + vite build) ON THE WAY IN, SO THE TYPECHECK IS PART OF IT
      - name: Build app
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: why2-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest

    # THE SIGNING STEP IS GATED ON WHETHER THE KEYSTORE IS CONFIGURED, AND THE `secrets` CONTEXT IS NOT ONE
    # OF THE ONES A STEP'S `if` CAN SEE - SO THE SECRETS ARE LIFTED INTO env HERE, WHICH IT CAN
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # THE ANDROID BUILD IS client_base + client_voice - NO xcap, NO openh264 - AND WHAT THE CALL NEEDS IS
      # NOT ON THE RUNNER EITHER: libopus IS CROSS-COMPILED PER ABI BY scripts/opus-android.sh, WHICH THE
      # android:* SCRIPTS RUN THEMSELVES. WHAT IS WANTED HERE IS A JDK THE ANDROID GRADLE PLUGIN ACCEPTS
      # (25 IS TOO NEW FOR IT), THE NDK, AND THE FOUR ANDROID STD TARGETS
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Point at the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # FOUR C BUILDS OF libopus IS A FEW MINUTES OF EVERY RUN, AND THE ANSWER ONLY CHANGES WHEN THE SCRIPT
      # THAT ASKS FOR IT DOES - THE OPUS VERSION AND ITS HASH ARE BOTH PINNED IN THERE
      - name: Cache libopus
        uses: actions/cache@v4
        with:
          path: src-tauri/gen/opus
          key: opus-${{ runner.os }}-${{ hashFiles('scripts/opus-android.sh') }}

      # gen/android IS GENERATED AND NOT COMMITTED, SO IT IS MADE HERE. THE TARGETS ARE ALREADY IN PLACE
      # ABOVE, WHICH IS WHAT --skip-targets-install IS SAYING - IT IS ALSO THE ONE FLAG THAT KEEPS rustup
      # OUT OF THE PICTURE ENTIRELY
      - name: Generate the Android project
        run: npm run android:init -- --skip-targets-install

      - name: Build APK
        run: npm run android:build -- --apk

      # THE GENERATED GRADLE PROJECT CARRIES NO signingConfigs, SO A RELEASE APK COMES OUT UNSIGNED AND
      # NOTHING WILL INSTALL IT. IT IS SIGNED HERE RATHER THAN BY PATCHING build.gradle.kts, WHICH IS A
      # GENERATED FILE THIS JOB HAS JUST WRITTEN. SET ANDROID_KEYSTORE (base64 OF THE .jks),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS AND ANDROID_KEY_PASSWORD IN THE REPOSITORY SECRETS
      # TO TURN THIS ON; WITHOUT THEM THE UNSIGNED APK IS STILL BUILT AND UPLOADED
      - name: Sign APK
        if: ${{ env.ANDROID_KEYSTORE != '' }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"

          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk'); do
            "$TOOLS/zipalign" -f -p 4 "$apk" "${apk%-unsigned.apk}-aligned.apk"

            "$TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/keystore.jks" \
              --ks-pass "env:KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "env:KEY_PASSWORD" \
              --out "${apk%-unsigned.apk}.apk" \
              "${apk%-unsigned.apk}-aligned.apk"

            rm -f "$apk" "${apk%-unsigned.apk}-aligned.apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: why2-desktop-android
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # UPLOADS THE BUNDLES TO THE OIDC ENDPOINT AS why2_desktop-<BRANCH>-<VARIANT>. THE BRANCH IS NOT SENT:
  # IT COMES OUT OF THE TOKEN THE ENDPOINT HAS JUST VERIFIED, SO A RUN CANNOT PUBLISH AS ANOTHER BRANCH
  publish:
    needs: [ build-desktop, build-android ]
    runs-on: ubuntu-latest
    # SKIPS SILENTLY IN A FORK, OR BEFORE THE ENDPOINT IS CONFIGURED
    if: vars.DL_ENDPOINT != ''

    permissions:
      contents: read
      id-token: write        # LETS THE RUN MINT ITS OWN OIDC TOKEN

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          ENDPOINT: ${{ vars.DL_ENDPOINT }}
          AUDIENCE: why2-dl
        run: |
          set -euo pipefail

          # ACTIONS_ID_TOKEN_REQUEST_{URL,TOKEN} ARE INJECTED BY `id-token: write`.
          # A FRESH TOKEN PER FILE: THE ENDPOINT ACCEPTS EACH `jti` EXACTLY ONCE.
          mint() {
            curl -sS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value
          }

          # RETRIED BY HAND RATHER THAN WITH --retry: THE ENDPOINT SPENDS A TOKEN'S
          # `jti` THE FIRST TIME IT SEES IT, SO curl'S OWN RETRY WOULD RESEND A SPENT
          # ONE AND REPORT THE RESULTING 401 INSTEAD OF THE REAL ERROR
          publish() {
            local file="$1" variant="$2" sum token attempt=1
            sum="$(sha256sum "$file" | cut -d' ' -f1)"

            while true; do
              token="$(mint)"
              echo "::add-mask::$token"

              # --fail-with-body, NOT -f: THE ENDPOINT'S REJECTION REASON IS IN THE
              # BODY, AND -f DISCARDS IT
              if curl -sS --fail-with-body \
                   -X PUT "$ENDPOINT/$variant" \
                   -H "Authorization: Bearer $token" \
                   -H "X-Content-SHA256: $sum" \
                   --data-binary "@$file"; then
                echo "published $variant <- ${file##*/} ($sum)"
                return 0
              fi

              if [ "$attempt" -ge 3 ]; then
                echo "giving up on $variant after $attempt attempts" >&2
                return 1
              fi

              attempt=$((attempt + 1))
              sleep 5
            done
          }

          # THE BUNDLE FILENAMES CARRY THE VERSION AND THE ARCH, SO THEY ARE FOUND BY
          # EXTENSION RATHER THAN NAMED - EACH ONE IS UNIQUE WITHIN ITS ARTIFACT
          pick() {
            find "dist/$1" -type f -name "$2" 2>/dev/null | sort | head -n1
          }

          publish_one() {
            local artifact="$1" pattern="$2" variant="$3" file

            file="$(pick "$artifact" "$pattern")"

            if [ -z "$file" ]; then
              echo "no $pattern in $artifact" >&2
              return 1
            fi

            publish "$file" "$variant"
          }

          publish_one why2-desktop-ubuntu-latest   '*.AppImage'   linux.AppImage
          publish_one why2-desktop-ubuntu-latest   '*.deb'        linux.deb
          publish_one why2-desktop-ubuntu-latest   '*.rpm'        linux.rpm
          publish_one why2-desktop-macos-latest    '*.dmg'        macos.dmg
          publish_one why2-desktop-windows-latest  '*.msi'        windows.msi
          publish_one why2-desktop-windows-latest  '*-setup.exe'  windows-setup.exe

          # THE APK JOB CAN EMIT PER-ABI SPLITS ALONGSIDE THE UNIVERSAL ONE, AND THE
          # UNIVERSAL ONE IS THE ONLY BUILD THAT INSTALLS ANYWHERE
          apk="$(pick why2-desktop-android '*universal*.apk')"
          [ -n "$apk" ] || apk="$(pick why2-desktop-android '*.apk')"

          if [ -z "$apk" ]; then
            echo "no apk in why2-desktop-android" >&2
            exit 1
          fi

          publish "$apk" android.apk
