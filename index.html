<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- THE WINDOW IS ALSO A PHONE NOW. viewport-fit=cover PUTS THE PAGE UNDER THE NOTCH AND THE
             GESTURE BAR (index.css PAYS THE INSETS BACK), interactive-widget=resizes-content MAKES THE
             SOFT KEYBOARD SHRINK THE PAGE INSTEAD OF SLIDING IT UP - WHICH IS THE WHOLE DIFFERENCE
             BETWEEN A COMPOSER ABOVE THE KEYS AND ONE PUSHED OFF THE TOP OF THE SCREEN -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#050405" />
        <title>WHY2</title>

        <!-- THE FIRST PAINT, AND THE ONLY STYLING IN THIS PROJECT THAT IS NOT IN index.css: EVERYTHING
             ELSE ARRIVES WITH THE BUNDLE, AND ON A PHONE THAT IS A FEW SECONDS OF SOMETHING TO LOOK AT.
             SO THE PAGE IS THE WINDOW'S OWN SURFACE FROM THE VERY FIRST FRAME - NOT THE WEBVIEW'S
             DEFAULT - AND THE MARK STANDS ON IT, BREATHING, UNTIL main.tsx TAKES IT DOWN.
             IT STANDS *OVER* #root AND NOT INSIDE IT, BECAUSE A DESKTOP LOADS THE BUNDLE IN A FEW
             MILLISECONDS: LEFT IN THE CONTAINER IT WAS SWEPT AWAY BY THE FIRST RENDER TOO QUICKLY TO BE
             ANYTHING BUT A FLICKER, AND THE PROGRAM OPENED ON NOTHING IN PARTICULAR -->
        <style>
            html, body { margin: 0; height: 100%; background: #050405; }

            #boot
            {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #050405;
                transition: opacity 250ms ease;
            }

            /* THE WINDOW BEHIND IT IS ALREADY DRAWN BY THE TIME THIS IS SET, SO GOING IS A FADE AND NOT
               A CUT - AND THE MARK STOPS TAKING THE POINTER THE MOMENT IT STARTS LEAVING */
            #boot.gone
            {
                opacity: 0;
                pointer-events: none;
            }

            #boot img
            {
                width: 96px;
                height: 96px;
                animation: boot 1.4s ease-in-out infinite;
            }

            @keyframes boot
            {
                0%, 100% { opacity: 0.3; }
                50%      { opacity: 1; }
            }
        </style>
    </head>

    <body>
        <div id="root"></div>
        <div id="boot"><img src="/why2.svg" alt="WHY2" /></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
