# The window's own words. Everything the terminal client also says is in why2-chat's locale and is
# read from there; this file is only what the window has and the TUI does not.
#
# To translate: copy this file to <config dir>/locales/desktop/<language>.toml, beside the crate's
# own <language>.toml, and translate the values. {name} is filled in by the program, a table of
# one/few/many/other is a plural, and [meta] plurals picks the rule exactly as the crate's does.

