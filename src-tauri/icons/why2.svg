THE SOURCE OF EVERY ICON IN THE PROJECT - scripts/icons.sh IS WHAT TURNS IT INTO THEM.
THE MARK IS THE TERMINAL CLIENT'S OWN (chat/assets/why2.ico IN THE WHY2 REPOSITORY), TRACED TO A PATH;
THE PLATE UNDER IT IS THIS APP'S DEEPEST SURFACE (THE `deep` TOKEN IN src/theme.css), BECAUSE A WHITE MARK ON
TRANSPARENCY IS ONE THAT VANISHES ON HALF THE HOME SCREENS IT LANDS ON.
THE NESTED <svg> IS THE MARK ALONE, AND scripts/icons.sh CUTS THE ADAPTIVE FOREGROUND OUT OF IT
