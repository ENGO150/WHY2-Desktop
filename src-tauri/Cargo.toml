[package]
name = "why2-desktop"
version = "1.0.0"
description = "Chat, voice calls and screen sharing over the WHY2 protocol"
authors = ["Václav Šmejkal <engo@satan.red>"]
license = "GPL-3.0-only"
homepage = "https://why2.satan.red"
repository = "https://git.satan.red/ENGO150/WHY2-Desktop"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "why2_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
sha2 = "0.11"

# THE SERVER LIST IS OURS AND LIVES BESIDE THE CRATE'S OWN CONFIG, IN THE SAME LANGUAGE AS IT
toml = "1"

# THE DESKTOP BUILD IS THE WHOLE PROGRAM: THE CHAT, THE CALL AND THE SCREEN SHARE BOTH WAYS
[target.'cfg(not(target_os = "android"))'.dependencies]
why2-chat = { version = "2.0.1", default-features = false, features = ["client_base", "client_voice", "client_screen"] }

# A WATCHED SHARE IS DECODED HERE WHEN THE WEBVIEW CANNOT DO IT ITSELF - openh264 IS THE CRATE'S OWN
# DECODER, AND THE JPEG IS WHAT THE PICTURE TRAVELS TO THE CANVAS AS
openh264 = "0.9.8"
jpeg-encoder = { version = "0.7", features = ["simd"] }

# ANDROID GETS THE CHAT AND THE CALL, AND NOT THE SCREEN SHARE. client_voice ASKS cpal FOR A DEVICE, AND
# ON A PHONE THAT IS AAudio RATHER THAN PULSEAUDIO (WHOSE DEPENDENCY cpal GATES TO LINUX ITSELF); THE ONE
# THING IN IT THAT DOES NOT CROSS-COMPILE IS audiopus' BUNDLED libopus, WHICH IS BUILT AHEAD OF THE APP BY
# scripts/opus-android.sh AND FOUND THROUGH pkg-config. client_screen CAPTURES THROUGH xcap/libwayshot AND
# DRAWS THROUGH winit/wgpu, WHICH WANT THE MAIN THREAD TAURI ALREADY OWNS - AND A PHONE SHARES ITS SCREEN
# THROUGH MediaProjection ANYWAY - SO THAT ONE IS OFF, AND build.rs TURNS THE `screen` CFG OFF WITH IT
[target.'cfg(target_os = "android")'.dependencies]
why2-chat = { version = "2.0.1", default-features = false, features = ["client_base", "client_voice"] }

# THE FILE PICKER ON ANDROID ANSWERS WITH A content:// URI, WHICH IS A HANDLE ON SOMEBODY ELSE'S FILE AND
# NOT A PLACE ON THE DISK - THE CONTENT RESOLVER IS THE ONLY THING THAT OPENS ONE, AND THIS IS THE WAY TO
# IT FROM RUST. IT IS WHAT LETS AN UPLOAD BE STAGED IN OUR OWN CACHE (input.rs, stage_content_uri)
tauri-plugin-fs = "2"

# ASKING FOR THE MICROPHONE IS A JAVA CALL AND NOTHING ELSE WILL DO IT, AND cpal PANICS ENUMERATING
# DEVICES UNTIL SOMEBODY HANDS ndk-context THE VM AND A Context - TAURI'S ANDROID SIDE IS KOTLIN AND HAS
# NO USE FOR EITHER, SO src/android.rs IS WHERE BOTH HAPPEN. THE jni VERSION IS cpal'S, SO THE APP AND ITS
# AUDIO BACKEND SHARE ONE
jni = "0.22"
ndk-context = "0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
